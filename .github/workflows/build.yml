name: build-lpk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm i -g @lazycatcloud/lzc-cli@2.0.9
      - run: |
          mkdir -p dist
          lzc-cli project release -o dist/zealot.lpk
      - uses: actions/upload-artifact@v4
        with: {name: lpk, path: dist/zealot.lpk}
