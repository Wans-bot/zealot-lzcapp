name: push-image
on:
  workflow_dispatch:
    inputs:
      src: {default: "tryzealot/zealot:6.2.2"}
      dst: {default: "ttl.sh/wans-zealot-6.2.2:24h"}
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker pull "${{ inputs.src }}"
          docker tag "${{ inputs.src }}" "${{ inputs.dst }}"
          docker push "${{ inputs.dst }}"
